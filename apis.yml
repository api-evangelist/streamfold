name: Streamfold
description: >-
  Streamfold is the company behind Rotel, a high-performance, resource-efficient
  OpenTelemetry collector written in Rust. Rotel focuses on minimal overhead and
  fast cold-starts for resource-constrained environments such as AWS Lambda,
  serverless functions, and embedded systems, supporting OTLP/gRPC, OTLP/HTTP,
  and Kafka receivers with exporters for ClickHouse, Datadog, AWS X-Ray, Kafka,
  and OTLP. It ships Python (pyrotel) and Node.js (@streamfold/rotel) embeddings,
  an AWS Lambda extension layer, a CloudWatch Lambda forwarder, and a Rust
  processor SDK. Rotel is open source under Apache-2.0. In March 2026 Streamfold
  announced it is joining Cursor to bring observability to agentic, AI-driven
  software systems. Streamfold was a portfolio company of Uncork Capital.
